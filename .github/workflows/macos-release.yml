name: macOS release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      FILESHARING_ORIGIN: https://filesharing.ryanl.in
    outputs:
      image: ${{ steps.package.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and verify the universal DMG
        id: package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a version tag formatted as vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          scripts/build-agent.sh dmg
          image="FileSharingService-$version.dmg"
          cd artifacts
          if [[ ! -f "$image" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match the built app version." >&2
            exit 1
          fi
          shasum -a 256 -c "$image.sha256"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-dmg
          path: |
            artifacts/${{ steps.package.outputs.image }}
            artifacts/${{ steps.package.outputs.image }}.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-dmg
      - name: Publish the DMG and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          sha256sum -c "$IMAGE.sha256"
          gh release create "$GITHUB_REF_NAME" "$IMAGE" "$IMAGE.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "FileSharingService $GITHUB_REF_NAME"
