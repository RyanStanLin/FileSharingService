worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $filesharing_connection {
        default upgrade;
        '' close;
    }

    map $http_cf_connecting_ip $filesharing_peer {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        client_max_body_size 2m;
        resolver 127.0.0.11 ipv6=off valid=2s;
        resolver_timeout 3s;

        location ~* ^/_sftp(?:/|$) {
            return 404;
        }

        location ~* ^/(?:api|agent|health|openapi)(?:/|$) {
            set $backend http://server:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $filesharing_peer;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $filesharing_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
