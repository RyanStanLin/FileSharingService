asyncapi: 3.0.0
info:
  title: FileSharing browser events
  version: 1.3.0
servers:
  enterprise:
    host: filesharing.example.com
    protocol: wss
channels:
  browserEvents:
    address: /api/v1/events/ws
    description: Requires the same-origin administrator session and an Origin header.
    messages:
      subscribe:
        $ref: '#/components/messages/Subscribe'
      unsubscribe:
        $ref: '#/components/messages/Unsubscribe'
      ready:
        $ref: '#/components/messages/Ready'
      subscribed:
        $ref: '#/components/messages/Subscribed'
      event:
        $ref: '#/components/messages/Event'
      unsubscribed:
        $ref: '#/components/messages/Unsubscribed'
      error:
        $ref: '#/components/messages/Error'
operations:
  acceptSubscriptions:
    action: receive
    channel:
      $ref: '#/channels/browserEvents'
    messages:
      - $ref: '#/channels/browserEvents/messages/subscribe'
      - $ref: '#/channels/browserEvents/messages/unsubscribe'
  publishEvents:
    action: send
    channel:
      $ref: '#/channels/browserEvents'
    messages:
      - $ref: '#/channels/browserEvents/messages/ready'
      - $ref: '#/channels/browserEvents/messages/subscribed'
      - $ref: '#/channels/browserEvents/messages/event'
      - $ref: '#/channels/browserEvents/messages/unsubscribed'
      - $ref: '#/channels/browserEvents/messages/error'
components:
  messages:
    Subscribe:
      contentType: application/json
      payload:
        type: object
        required: [type, id, topic]
        allOf:
          - if:
              properties:
                topic:
                  const: windows.changed
            then:
              properties:
                after:
                  $ref: '#/components/schemas/WindowRevision'
            else:
              properties:
                after:
                  $ref: '#/components/schemas/Cursor'
          - if:
              properties:
                topic:
                  const: notifications.changed
            then:
              description: Global notification updates. Omit deviceId, rootId and path. Uses a separate cursor.
              properties:
                deviceId: false
                rootId: false
                path: false
            else:
              required: [deviceId]
        properties:
          type:
            const: subscribe
          id:
            type: string
            minLength: 1
            maxLength: 64
          deviceId:
            type: string
            format: uuid
          topic:
            type: string
          rootId:
            type: string
            format: uuid
            description: Required for files.changed.
          path:
            type: string
            description: Relative directory path for files.changed. Empty selects the root.
    Unsubscribe:
      payload:
        type: object
        required: [type, id]
        properties:
          type:
            const: unsubscribe
          id:
            type: string
    Ready:
      payload:
        type: object
        required: [type, cursor]
        properties:
          type:
            const: ready
          cursor:
            $ref: '#/components/schemas/Cursor'
    Subscribed:
      payload:
        type: object
        required: [type, id, cursor, snapshotRequired]
        properties:
          type:
            const: subscribed
          id:
            type: string
          cursor:
            oneOf:
              - $ref: '#/components/schemas/Cursor'
              - $ref: '#/components/schemas/WindowRevision'
              - type: 'null'
          snapshotRequired:
            type: boolean
    Unsubscribed:
      payload:
        type: object
        required: [type, id]
        properties:
          type:
            const: unsubscribed
          id:
            type: string
    Event:
      payload:
        type: object
        required: [type, id, item]
        properties:
          type:
            const: event
          id:
            type: string
          item:
            $ref: '#/components/schemas/EventItem'
    Error:
      payload:
        type: object
        required: [type, code]
        properties:
          type:
            const: error
          id:
            type: [string, 'null']
          code:
            type: string
  schemas:
    Cursor:
      type: string
      pattern: '^[0-9]+$'
    WindowRevision:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
      description: Opaque window revision. Omit after to receive the latest full window snapshot on subscription.
    NotificationUpdate:
      type: object
      required: [resource, id, action]
      properties:
        resource:
          enum: [channel, rule, delivery]
        id:
          type: string
          format: uuid
        action:
          enum: [created, updated, deleted]
        revision:
          type: [integer, 'null']
        state:
          enum: [queued, sending, retryScheduled, sent, failed, cancelled, null]
        channelId:
          type: [string, 'null']
          format: uuid
        ruleId:
          type: [string, 'null']
          format: uuid
    EventItem:
      type: object
      required: [sequence, deviceId, topic, time, payload]
      allOf:
        - if:
            properties:
              topic:
                const: notifications.changed
          then:
            properties:
              deviceId:
                type: [string, 'null']
              payload:
                $ref: '#/components/schemas/NotificationUpdate'
          else:
            properties:
              deviceId:
                type: string
        - if:
            properties:
              topic:
                const: windows.changed
          then:
            properties:
              sequence:
                $ref: '#/components/schemas/WindowRevision'
              payload:
                $ref: '#/components/schemas/WindowSnapshot'
          else:
            properties:
              sequence:
                $ref: '#/components/schemas/Cursor'
        - if:
            properties:
              topic:
                const: clipboard.changed
          then:
            properties:
              payload:
                $ref: '#/components/schemas/ClipboardChange'
        - if:
            properties:
              topic:
                const: lid.changed
          then:
            properties:
              payload:
                $ref: '#/components/schemas/LidChange'
        - if:
            properties:
              topic:
                const: jobs.output
          then:
            properties:
              payload:
                $ref: '#/components/schemas/JobOutput'
        - if:
            properties:
              topic:
                const: jobs.changed
          then:
            properties:
              payload:
                $ref: '#/components/schemas/JobChanged'
      properties:
        deviceId:
          type: [string, 'null']
          format: uuid
        topic:
          type: string
        time:
          type: string
          format: date-time
        payload:
          description: Topic-specific value. windows.changed uses WindowSnapshot including the initial observation.
    WindowSnapshot:
      type: object
      required: [revision, observedAt, value]
      properties:
        revision:
          $ref: '#/components/schemas/WindowRevision'
        observedAt:
          type: string
          format: date-time
        value:
          type: object
          required: [available, displays, activePid, focusStatus, focusedWindowId, windows, truncated]
          properties:
            available:
              type: boolean
            activePid:
              type: [integer, 'null']
            focusStatus:
              enum: [foreground, noFocusedWindow, unavailable]
            focusedWindowId:
              type: [integer, 'null']
            truncated:
              type: boolean
            displays:
              type: array
              maxItems: 32
              items:
                type: object
                required: [id, main, bounds]
                properties:
                  id: {type: integer}
                  main: {type: boolean}
                  bounds:
                    $ref: '#/components/schemas/WindowBounds'
            windows:
              type: array
              maxItems: 1024
              items:
                $ref: '#/components/schemas/WindowDetails'
    WindowBounds:
      type: object
      required: [x, y, width, height]
      properties:
        x: {type: number}
        y: {type: number}
        width: {type: number, minimum: 0}
        height: {type: number, minimum: 0}
    WindowDetails:
      type: object
      required: [id, pid, ownerName, layer, alpha, bounds, displayId, relativeBounds, onScreen, zIndex, frontmost,
                 ownerFrontmost, focused, occlusion]
      properties:
        id: {type: integer}
        pid: {type: integer}
        ownerName: {type: [string, 'null']}
        layer: {type: integer}
        alpha: {type: number, minimum: 0, maximum: 1}
        bounds:
          $ref: '#/components/schemas/WindowBounds'
        displayId: {type: [integer, 'null']}
        relativeBounds:
          oneOf:
            - $ref: '#/components/schemas/WindowBounds'
            - type: 'null'
        onScreen: {type: boolean}
        zIndex: {type: [integer, 'null'], minimum: 0}
        frontmost: {type: boolean}
        ownerFrontmost: {type: boolean}
        focused: {type: boolean}
        occlusion:
          type: object
          required: [state, coveredFraction, occludingWindowIds]
          properties:
            state:
              enum: [visible, partial, covered, notDisplayed, unknown]
            coveredFraction: {type: [number, 'null'], minimum: 0, maximum: 1}
            occludingWindowIds:
              type: array
              maxItems: 16
              items: {type: integer}
    JobOutput:
      type: object
      required: [jobId, index, stream, data]
      properties:
        jobId:
          type: string
          format: uuid
        index:
          type: integer
          minimum: 1
          maximum: 64
        stream:
          enum: [stdout, stderr]
        data:
          type: string
          contentEncoding: base64
    JobChanged:
      type: object
      required: [id, state, kind]
      properties:
        id:
          type: string
          format: uuid
        state:
          enum: [completed, cancelled, failed]
        kind:
          type: string
        exitCode:
          type: integer
          minimum: 0
          maximum: 255
          description: Present for predefined and custom diagnostics that returned a process exit code.
    ClipboardChange:
      type: object
      description: Timestamp metadata. Use the enclosing event sequence to retrieve the agent-supplied text from the clipboard archive over REST.
      additionalProperties: false
      required: [occurredAt]
      properties:
        occurredAt:
          type: string
          format: date-time
    LidChange:
      type: object
      required: [lidClosed, occurredAt]
      properties:
        lidClosed:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    DirectoryEvent:
      type: object
      required: [watchId, rootId, path, change]
      properties:
        watchId:
          type: string
          format: uuid
        rootId:
          type: string
          format: uuid
        path:
          type: string
        change:
          type: object
          required: [kind, revision]
          properties:
            kind:
              enum: [delta, resync_required]
            revision:
              type: [string, 'null']
            previousRevision:
              type: string
            changes:
              type: array
              items:
                type: object
                required: [kind, entry]
                properties:
                  kind:
                    enum: [added, removed, updated, renamed]
                  fromPath:
                    type: string
                  entry:
                    type: object
                    description: FileEntry metadata from the REST contract.
